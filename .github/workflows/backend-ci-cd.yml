# Pipeline del backend de PetAdopt
#
#   develop / preproduccion / main / pull requests  ->  compilar + pruebas + SonarCloud + validar docker-compose
#
# El despliegue NO es automático: on-premise (VirtualBox) y cloud (AWS EC2) se levantan con el mismo
# docker-compose.yml (git pull + docker compose up -d --build). Ver docs/DESPLIEGUE-SO.md.
#
# El repositorio tiene el backend en la carpeta backend/ (este archivo va en la RAÍZ: .github/workflows/).
#
# Secretos del repositorio (Settings > Secrets and variables > Actions > Secrets):
#   SONAR_TOKEN   token de SonarCloud (opcional: sin él se omite el análisis)
# Variables del repositorio (misma pantalla, pestaña Variables):
#   SONAR_ORGANIZATION   clave de la organización en SonarCloud
#   SONAR_PROJECT_KEY    clave del proyecto en SonarCloud
name: Backend CI

on:
  push:
    branches: [develop, preproduccion, main]
  pull_request:
    branches: [develop, preproduccion, main]
  workflow_dispatch:

# Las acciones van fijadas por SHA (el comentario indica la versión): una etiqueta como v4 se puede mover
# a otro código sin aviso; un SHA no.
permissions:
  contents: read

# Si llegan dos push seguidos a la misma rama, se cancela la ejecución anterior
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Compilar, ejecutar las pruebas unitarias (JaCoCo) y analizar en SonarCloud
  # ---------------------------------------------------------------------------
  build-test:
    name: Compilar, probar y analizar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # SonarCloud usa el historial completo para saber qué código es nuevo

      - name: Instalar Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Dar permiso de ejecución a mvnw
        run: chmod +x mvnw # en Windows git suele perder este permiso

      - name: Compilar y ejecutar las pruebas
        run: ./mvnw -B -ntp clean verify

      - name: Guardar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reportes-backend
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

      - name: Análisis en SonarCloud
        # Se omite si el secreto no existe (por ejemplo, en pull requests desde un fork)
        if: env.SONAR_TOKEN != ''
        run: >-
          ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.qualitygate.wait=true

  # ---------------------------------------------------------------------------
  # 2. Validar que docker-compose.yml es correcto en los dos ambientes (sin secretos reales)
  # ---------------------------------------------------------------------------
  compose:
    name: Validar docker-compose (on-premise y cloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: On-premise (base de datos en contenedor)
        env:
          COMPOSE_PROFILES: db-local
          DB_PASSWORD: solo-para-validar
          JWT_SECRET: solo-para-validar-solo-para-validar
        run: docker compose -f docker-compose.yml config --quiet
      - name: Cloud (base de datos en RDS)
        env:
          DB_HOST: ejemplo.rds.amazonaws.com
          DB_PARAMS: "?sslmode=require"
          DB_PASSWORD: solo-para-validar
          JWT_SECRET: solo-para-validar-solo-para-validar
        run: docker compose -f docker-compose.yml config --quiet
