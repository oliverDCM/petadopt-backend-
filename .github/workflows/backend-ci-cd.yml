# Pipeline del backend de PetAdopt
#
#   develop / preproduccion / main / pull requests  ->  compilar + pruebas + SonarCloud
#   main (push)                                      ->  además: imagen Docker en GHCR y despliegue en AWS EC2
#
# El repositorio tiene el backend en la carpeta backend/ (este archivo va en la RAÍZ: .github/workflows/).
#
# Secretos del repositorio (Settings > Secrets and variables > Actions > Secrets):
#   SONAR_TOKEN   token de SonarCloud
#   EC2_HOST      IP elástica (o DNS) del servidor EC2
#   EC2_USER      usuario SSH del servidor (ubuntu)
#   EC2_SSH_KEY   contenido completo del archivo .pem del par de llaves
# Variables del repositorio (misma pantalla, pestaña Variables):
#   SONAR_ORGANIZATION   clave de la organización en SonarCloud
#   SONAR_PROJECT_KEY    clave del proyecto en SonarCloud
name: Backend CI/CD

on:
  push:
    branches: [develop, preproduccion, main]
  pull_request:
    branches: [develop, preproduccion, main]
  workflow_dispatch:

# Las acciones van fijadas por SHA (el comentario indica la versión): una etiqueta como v4 se puede mover
# a otro código sin aviso; un SHA no.
permissions:
  contents: read

# Si llegan dos push seguidos a la misma rama, se cancela la ejecución anterior
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Compilar, ejecutar las pruebas unitarias (JaCoCo) y analizar en SonarCloud
  # ---------------------------------------------------------------------------
  build-test:
    name: Compilar, probar y analizar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # SonarCloud usa el historial completo para saber qué código es nuevo

      - name: Instalar Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Dar permiso de ejecución a mvnw
        run: chmod +x mvnw # en Windows git suele perder este permiso

      - name: Compilar y ejecutar las pruebas
        run: ./mvnw -B -ntp clean verify

      - name: Guardar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reportes-backend
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

      - name: Análisis en SonarCloud
        # Se omite si el secreto no existe (por ejemplo, en pull requests desde un fork)
        if: env.SONAR_TOKEN != ''
        run: >-
          ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.qualitygate.wait=true

  # ---------------------------------------------------------------------------
  # 2. Construir la imagen Docker y publicarla en GitHub Container Registry
  # ---------------------------------------------------------------------------
  imagen:
    name: Publicar imagen Docker
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Nombre de la imagen (GHCR exige minúsculas)
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/petadopt-backend" >> "$GITHUB_ENV"

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 3. Desplegar en el servidor EC2 de AWS
  # ---------------------------------------------------------------------------
  desplegar:
    name: Desplegar en AWS EC2
    needs: imagen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar la llave SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copiar el docker-compose de producción
        run: |
          ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" 'mkdir -p ~/petadopt'
          scp -i ~/.ssh/ec2.pem backend/deploy/docker-compose.prod.yml "$EC2_USER@$EC2_HOST:~/petadopt/docker-compose.prod.yml"

      - name: Iniciar sesión en GHCR desde el servidor
        # El token va por la entrada estándar: no queda en el historial ni en la lista de procesos
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Actualizar el backend
        run: |
          ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" 'bash -s' <<'EOF'
          set -euo pipefail
          cd ~/petadopt
          test -f .env || { echo "Falta ~/petadopt/.env en el servidor (ver deploy/DESPLIEGUE-AWS.md)"; exit 1; }
          # La carpeta de logs la crea el usuario ubuntu (UID 1000) para que el contenedor pueda escribir
          mkdir -p logs/backend
          docker compose -f docker-compose.prod.yml pull backend
          # --wait espera a que el healthcheck (/actuator/health) quede en "healthy"; si no, falla el paso
          if ! docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 180 backend; then
            echo "El backend no quedó sano. Últimas líneas del log:"
            docker compose -f docker-compose.prod.yml logs --tail 80 backend
            exit 1
          fi
          docker compose -f docker-compose.prod.yml ps
          docker image prune -f
          EOF

      - name: Cerrar sesión en GHCR
        if: always()
        run: ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" 'docker logout ghcr.io' || true
