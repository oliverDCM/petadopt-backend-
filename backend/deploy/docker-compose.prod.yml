# Producción en AWS EC2. Lo copia el pipeline del backend a ~/petadopt/ en el servidor.
# Usa las imágenes ya construidas por GitHub Actions (GHCR); en el servidor no se compila nada.
# La base de datos NO corre aquí: está en Amazon RDS (servicio administrado, con copias de seguridad automáticas).
# Los valores salen de ~/petadopt/.env (plantilla: deploy/env.produccion.example). Nunca se sube al repositorio.
#
#   Ver estado:  docker compose -f docker-compose.prod.yml ps
#   Ver logs:    docker compose -f docker-compose.prod.yml logs -f backend
#   Archivos:    tail -f ~/petadopt/logs/backend/petadopt.log
name: petadopt

services:

  # Correos de recuperación de contraseña. Si en .env pones un SMTP real (Gmail), se usa ese.
  # La bandeja solo escucha en el propio servidor: se abre con un túnel SSH (ver DESPLIEGUE-AWS.md).
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - petadopt-net

  backend:
    image: ghcr.io/${GHCR_OWNER:?Falta GHCR_OWNER en .env}/petadopt-backend:${BACKEND_TAG:-latest}
    restart: unless-stopped
    depends_on:
      mailpit:
        condition: service_started
    environment:
      # Base de datos en Amazon RDS (PostgreSQL administrado). sslmode=require: la conexión va cifrada
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:?Falta DB_HOST (endpoint de RDS) en .env}:${DB_PORT:-5432}/${DB_NAME:-petadopt}?sslmode=require
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-petadopt}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?Falta S3_BUCKET en .env}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Falta S3_ACCESS_KEY en .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Falta S3_SECRET_KEY en .env}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?Falta PUBLIC_URL en .env}
      FRONTEND_URL: ${PUBLIC_URL}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-PetAdopt <no-reply@petadopt.local>}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      LOG_FILE: /app/logs/petadopt.log
      # Límite de memoria de la JVM pensado para una instancia de 1-2 GB
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
    # Archivos de log en el servidor: ~/petadopt/logs/backend (sobreviven a recrear el contenedor)
    volumes:
      - ./logs/backend:/app/logs
    expose:
      - "8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - petadopt-net

  frontend:
    image: ghcr.io/${GHCR_OWNER}/petadopt-frontend:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Único puerto público: la app en http://<IP del servidor>/ ; nginx reenvía /api al backend
    ports:
      - "80:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - petadopt-net

networks:
  petadopt-net:
