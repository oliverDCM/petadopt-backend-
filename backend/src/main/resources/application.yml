server:
  port: 8080

spring:
  application:
    name: petadopt-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/petadopt}
    username: ${SPRING_DATASOURCE_USERNAME:petadopt}
    password: ${SPRING_DATASOURCE_PASSWORD:petadopt123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:cambia_este_secreto_largo_minimo_32_caracteres_aaaa}
  expiration-ms: 86400000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
