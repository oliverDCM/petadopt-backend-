# NGINX proxy inverso y balanceador de PetAdopt (único punto de entrada; lo publica docker compose).
#
#   /api/...  ->  upstream api_backend: backend1 y backend2 (round robin)
#   /...      ->  frontend (Angular servido por su propio nginx)
#
# Las réplicas y el frontend NO publican puertos: solo se llega a ellos por la red interna de Docker.

events {}

http {
    # DNS interno de Docker. Con "resolve" en cada server, NGINX vuelve a consultar la IP de la réplica:
    # si un contenedor se reinicia y cambia de IP, el balanceador lo sigue encontrando sin reiniciarse.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream api_backend {
        zone api_backend 64k;
        # Si una réplica falla una vez, se aparta 10 s y el tráfico va a la otra (comprobación pasiva)
        server backend1:8080 resolve max_fails=1 fail_timeout=10s;
        server backend2:8080 resolve max_fails=1 fail_timeout=10s;
        keepalive 16;
    }

    # Límites de peticiones por IP.
    #   auth: registro, login y recuperación cuestan CPU (BCrypt); sin límite un solo equipo saturaría el backend.
    #   api:  el resto de la API, contra ráfagas automáticas.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_req_status 429;

    # Registro: qué réplica atendió cada petición y cuánto tardó
    log_format balanceo '$remote_addr [$time_local] "$request" $status '
                        'replica=$upstream_addr t=$upstream_response_time s';

    server {
        listen 80;
        server_name _;
        access_log /var/log/nginx/access.log balanceo;

        # Fotos de hasta 5 MB (el backend admite 6 MB); el valor por defecto de NGINX es 1 MB y daría 413
        client_max_body_size 6m;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        # Si una réplica está caída, la petición se reintenta en la otra.
        # NGINX nunca reintenta POST/PUT (no idempotentes): así no se publica dos veces el mismo animal.
        proxy_next_upstream error timeout http_502 http_503;

        # Dirección de la réplica que respondió (además de X-Instancia, que pone el propio backend)
        add_header X-Upstream $upstream_addr always;

        location ^~ /api/auth/ {
            limit_req zone=auth burst=60 nodelay;
            proxy_pass http://api_backend;
        }

        location ^~ /api/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://api_backend;
        }

        # Salud del balanceador y de la API (la usa monitor.sh)
        location = /salud {
            proxy_pass http://api_backend/actuator/health;
        }

        location / {
            # Con variable, NGINX resuelve el nombre en cada petición (el frontend puede reiniciarse y cambiar de IP)
            set $frontend http://frontend:8080;
            proxy_pass $frontend;
        }
    }
}
