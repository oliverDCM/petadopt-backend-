# Despliegue completo con un solo comando (desde la carpeta petadopt):  docker compose up --build -d
#   App:       http://localhost:4200
#   pgAdmin:   http://localhost:5050
#   SonarQube: http://localhost:9000
#   Mailpit:   http://localhost:8025   (bandeja donde llegan los correos de desarrollo)
#   Logs:      carpeta petadopt/logs/backend
# Los secretos van en un archivo .env junto a este compose (plantilla: .env.example), nunca en el código.
# Sin POSTGRES_PASSWORD o JWT_SECRET en el .env, docker compose se niega a arrancar: no hay valores por defecto
# porque un secreto escrito en el repositorio lo conoce cualquiera.
# Solo la app (4200) es visible desde la red; la base de datos, pgAdmin, Mailpit, SonarQube y el backend
# escuchan únicamente en este equipo (127.0.0.1).
services:
  db:
    image: postgres:15
    container_name: petadopt-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-petadopt}
      POSTGRES_USER: ${POSTGRES_USER:-petadopt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el archivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petadopt} -d ${POSTGRES_DB:-petadopt}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - petadopt-net

  # HU-BE-22: servidor SMTP de pruebas. No envía nada a internet: guarda los correos y los muestra en la web.
  mailpit:
    image: axllent/mailpit:latest
    container_name: petadopt-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - petadopt-net

  backend:
    build:
      context: ./backend
    container_name: petadopt-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-petadopt}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-petadopt}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en el archivo .env (mínimo 32 caracteres)}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      # Pedidos de recuperación de contraseña por hora (por email y por IP). Para correr las E2E seguido: 100
      RECUPERACION_MAX_INTENTOS: ${RECUPERACION_MAX_INTENTOS:-3}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-PetAdopt <no-reply@petadopt.local>}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      LOG_FILE: /app/logs/petadopt.log
    # Los logs quedan en tu equipo, en petadopt/logs/backend (fuera del proyecto y del contenedor)
    volumes:
      - ./logs/backend:/app/logs
    # Solo accesible desde este PC (pruebas de carga, actuator); no desde la red
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - petadopt-net

  frontend:
    build:
      context: ./petadot-frontend-main
    container_name: petadopt-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:8080"
    networks:
      - petadopt-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: petadopt-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@petadopt.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - petadopt-net

  sonarqube:
    image: sonarqube:community
    container_name: petadopt-sonarqube
    restart: unless-stopped
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    networks:
      - petadopt-net

volumes:
  pgdata:
  pgadmin-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:

networks:
  petadopt-net:
